name: Build Shapla APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Show SHA fingerprints
        run: |
          gradle signingReport --no-daemon --console=plain 2>&1 | tee signing-report.txt
          echo "========== SIGNING FINGERPRINTS =========="
          grep -i -E 'Variant:|Config:|SHA1:|SHA-1:|SHA-256:' signing-report.txt || true

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shapla-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Save signing report
        uses: actions/upload-artifact@v4
        with:
          name: Shapla-Signing-Report
          path: signing-report.txt
          if-no-files-found: ignore